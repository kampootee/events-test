<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembrokeshire Events</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel to run JSX in the browser -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- EXTERNAL CONFIGURATION -->
    <script src="config.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --brand-primary: #0284c7;
            --brand-secondary: #0ea5e9;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            letter-spacing: -0.01em;
        }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .hero-gradient {
            background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(15, 23, 42, 0.85) 100%);
        }

        .event-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .event-card:hover {
            transform: translateY(-2px);
        }

        /* Tag Styles */
        .tag-pill {
            background-color: #f1f5f9;
            color: #475569;
            transition: all 0.2s;
        }
        .tag-pill:hover {
            background-color: #e0f2fe;
            color: #0284c7;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 antialiased">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;

        // Firebase Setup
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIGURATION ---
        const firebaseConfig = window.FIREBASE_CONFIG;
        const ADMIN_UID = window.ADMIN_UID;
        const appId = window.FIREBASE_APP_ID || 'localevents-app';

        const HEADER_IMAGE_URL = "img/header.jpg";

        const AVAILABLE_TAGS = [
            "Food Festivals", 
            "Live Music", 
            "Family Fun Days", 
            "Arts & Crafts", 
            "Wellness Meetup", 
            "Holiday Weekenders", 
            "Farmers Market", 
            "Coffee Mornings"
        ];

        const Icon = ({ name, size = 18, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (window.lucide && containerRef.current) {
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.style.width = `${size}px`;
                    i.style.height = `${size}px`;
                    containerRef.current.innerHTML = '';
                    containerRef.current.appendChild(i);
                    window.lucide.createIcons({
                        root: containerRef.current,
                        attrs: { class: className }
                    });
                }
            }, [name, size, className]);
            return <span ref={containerRef} className="inline-flex items-center justify-center pointer-events-none"></span>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [events, setEvents] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState(null);
            const [viewMode, setViewMode] = useState('list'); 
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [currentDate, setCurrentDate] = useState(new Date());
            const [activeTag, setActiveTag] = useState(null);
            
            const appInstance = useMemo(() => firebaseConfig ? initializeApp(firebaseConfig) : null, []);
            const authInstance = useMemo(() => appInstance ? getAuth(appInstance) : null, [appInstance]);
            const dbInstance = useMemo(() => appInstance ? getFirestore(appInstance) : null, [appInstance]);

            const isAdmin = user?.uid === ADMIN_UID;

            const [newEvent, setNewEvent] = useState({
                title: '', 
                date: '', 
                endDate: '', 
                time: '', 
                location: '', 
                description: '', 
                tags: [], 
                contact: '', 
                isMultiDay: false,
                entryType: 'Free', // Default
                entryFee: '',
                isOtherTagSelected: false,
                otherTag: ''
            });

            useEffect(() => {
                if (!authInstance) return;
                const initAuth = async () => {
                    try {
                        await signInAnonymously(authInstance);
                    } catch (error) {
                        setErrorMsg("Network issue.");
                        setIsLoading(false);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(authInstance, (u) => setUser(u));
                return () => unsubscribe();
            }, [authInstance]);

            useEffect(() => {
                if (!user || !dbInstance) return;
                const eventsCollection = collection(dbInstance, 'artifacts', appId, 'public', 'data', 'events');
                const unsubscribe = onSnapshot(query(eventsCollection), (snapshot) => {
                    setEvents(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                    setIsLoading(false);
                }, (err) => {
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [user, dbInstance]);

            const displayEvents = useMemo(() => {
                let filtered = [...events];
                if (!isAdmin) {
                    filtered = filtered.filter(e => e.status === 'approved' || (user && e.createdBy === user.uid));
                }
                if (activeTag) {
                    filtered = filtered.filter(e => 
                        e.location?.toLowerCase() === activeTag.toLowerCase() ||
                        (e.tags && e.tags.some(t => t.toLowerCase() === activeTag.toLowerCase())) ||
                        (e.entryType?.toLowerCase() === activeTag.toLowerCase())
                    );
                }
                return filtered.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
            }, [events, activeTag, isAdmin, user]);

            const handleAddEvent = async (e) => {
                e.preventDefault();
                if (!newEvent.title || !newEvent.date || !user) return;
                // Validation for Paid Entry
                if (newEvent.entryType === 'Paid' && !newEvent.entryFee) return;

                try {
                    const finalTags = [...newEvent.tags];
                    if (newEvent.isOtherTagSelected && newEvent.otherTag.trim()) {
                        finalTags.push(newEvent.otherTag.trim());
                    }

                    const eventsCollection = collection(dbInstance, 'artifacts', appId, 'public', 'data', 'events');
                    await addDoc(eventsCollection, {
                        ...newEvent,
                        tags: finalTags,
                        endDate: newEvent.isMultiDay ? newEvent.endDate : '',
                        status: isAdmin ? 'approved' : 'pending',
                        createdBy: user.uid,
                        createdAt: new Date().toISOString()
                    });
                    setNewEvent({ 
                        title: '', date: '', endDate: '', time: '', location: '', description: '', tags: [], contact: '', isMultiDay: false, entryType: 'Free', entryFee: '', isOtherTagSelected: false, otherTag: '' 
                    });
                    setIsModalOpen(false);
                } catch (error) { console.error(error); }
            };

            const approveEvent = async (id) => {
                const eventDoc = doc(dbInstance, 'artifacts', appId, 'public', 'data', 'events', id);
                await updateDoc(eventDoc, { status: 'approved' });
            };

            const deleteEvent = async (id) => {
                const eventDoc = doc(dbInstance, 'artifacts', appId, 'public', 'data', 'events', id);
                await deleteDoc(eventDoc);
            };

            const downloadCalendarFile = (event) => {
                const formatDate = (dateStr, timeStr) => {
                    const combined = new Date(`${dateStr}T${timeStr}`);
                    return combined.toISOString().replace(/-|:|\.\d+/g, '');
                };
                const start = formatDate(event.date, event.time);
                
                let end;
                if (event.endDate && event.endDate !== event.date) {
                    end = formatDate(event.endDate, "23:59:00");
                } else {
                    const endDateObj = new Date(new Date(`${event.date}T${event.time}`).getTime() + 60 * 60 * 1000);
                    end = endDateObj.toISOString().replace(/-|:|\.\d+/g, '');
                }

                const icsData = [
                    "BEGIN:VCALENDAR",
                    "VERSION:2.0",
                    "BEGIN:VEVENT",
                    `SUMMARY:${event.title}`,
                    `DTSTART:${start}`,
                    `DTEND:${end}`,
                    `LOCATION:${event.location}`,
                    `DESCRIPTION:${event.description || ''}`,
                    "END:VEVENT",
                    "END:VCALENDAR"
                ].join("\n");
                const blob = new Blob([icsData], { type: "text/calendar;charset=utf-8" });
                const link = document.createElement("a");
                link.href = window.URL.createObjectURL(blob);
                link.setAttribute("download", `${event.title.replace(/\s+/g, '_')}.ics`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const toggleTag = (tag) => {
                setNewEvent(prev => ({
                    ...prev,
                    tags: prev.tags.includes(tag) 
                        ? prev.tags.filter(t => t !== tag) 
                        : [...prev.tags, tag]
                }));
            };

            const calculateDuration = (start, end) => {
                if (!start || !end) return null;
                const s = new Date(start);
                const e = new Date(end);
                const diffTime = Math.abs(e - s);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                return diffDays > 1 ? `${diffDays} Day Event` : null;
            };

            const renderCalendar = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay();
                const days = [];
                for (let i = 0; i < firstDay; i++) days.push(<div key={`empty-${i}`} className="h-32 border-b border-r border-slate-100 bg-slate-50/30"></div>);
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const dayEvents = displayEvents.filter(e => e.date === dateStr);
                    days.push(
                        <div key={d} className="h-32 border-b border-r border-slate-100 p-2 hover:bg-sky-50/50 transition-colors">
                            <span className={`text-xs font-bold ${dayEvents.length > 0 ? 'text-sky-600 font-black' : 'text-slate-400'}`}>{d}</span>
                            <div className="mt-2 space-y-1 overflow-y-auto max-h-20">
                                {dayEvents.map(event => (
                                    <div 
                                        key={event.id} 
                                        onClick={() => { setActiveTag(event.location); setViewMode('list'); }} 
                                        className={`text-[9px] truncate px-1.5 py-0.5 rounded-md cursor-pointer font-bold transition-all shadow-sm ${event.status === 'pending' ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-white text-sky-700 border border-sky-100'}`}
                                    >
                                        {event.time} {event.title}
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }
                return days;
            };

            if (isLoading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-white space-y-6">
                    <div className="relative">
                        <div className="w-16 h-16 border-4 border-sky-50 rounded-full"></div>
                        <div className="w-16 h-16 border-4 border-t-sky-600 rounded-full animate-spin absolute top-0 left-0"></div>
                    </div>
                    <p className="text-slate-400 font-bold text-sm tracking-widest uppercase">Loading Pembs Events</p>
                </div>
            );

            return (
                <div className="min-h-screen pb-20">
                    <nav className="glass-effect sticky top-0 z-40 border-b border-slate-200/60 shadow-sm">
                        <div className="max-w-6xl mx-auto px-6 h-16 sm:h-20 flex items-center justify-between">
                            <div className="flex items-center gap-4 cursor-pointer group" onClick={() => setActiveTag(null)}>
                                <div className="bg-gradient-to-tr from-sky-600 to-indigo-600 p-2 rounded-xl shadow-lg shadow-sky-100 transition-all">
                                    <Icon name="waves" className="text-white" size={20} />
                                </div>
                                <h1 className="text-lg sm:text-xl font-black text-slate-900 tracking-tight leading-none">Pembs Events</h1>
                            </div>
                            
                            <div className="flex items-center gap-4 sm:gap-6">
                                <div className="hidden sm:flex bg-slate-100/80 p-1 rounded-xl border border-slate-200/50">
                                    <button onClick={() => setViewMode('list')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'list' ? 'bg-white shadow-sm text-sky-600' : 'text-slate-500 hover:text-slate-800'}`}>
                                        <Icon name="layout-list" size={14} /> List
                                    </button>
                                    <button onClick={() => setViewMode('calendar')} className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${viewMode === 'calendar' ? 'bg-white shadow-sm text-sky-600' : 'text-slate-500 hover:text-slate-800'}`}>
                                        <Icon name="calendar" size={14} /> Calendar
                                    </button>
                                </div>
                                <button onClick={() => setIsModalOpen(true)} className="bg-slate-900 hover:bg-slate-800 text-white px-5 sm:px-6 py-2.5 sm:py-3 rounded-xl flex items-center gap-2 text-xs sm:text-sm font-bold shadow-xl active:scale-95 transition-all">
                                    <Icon name="plus" size={16} className="text-sky-400" />
                                    {isAdmin ? "New Event" : "Submit"}
                                </button>
                            </div>
                        </div>
                    </nav>

                    <div className="relative w-full h-[300px] sm:h-[400px] overflow-hidden">
                        <img 
                            src={HEADER_IMAGE_URL} 
                            alt="Pembrokeshire Header" 
                            className="absolute inset-0 w-full h-full object-cover"
                            onerror="this.src='https://images.unsplash.com/photo-1589136561243-d3450d03227a?q=80&w=2070&auto=format&fit=crop'"
                        />
                        <div className="absolute inset-0 hero-gradient flex items-end">
                            <div className="max-w-6xl mx-auto px-6 w-full pb-10 sm:pb-16 text-white animate-in fade-in slide-in-from-bottom-6 duration-700">
                                <div className="flex items-center gap-3 mb-4">
                                    {isAdmin && <span className="bg-sky-600/80 backdrop-blur-md text-white text-[10px] font-black px-2.5 py-1 rounded-lg uppercase tracking-tighter shadow-xl">Admin Mode</span>}
                                    <span className="bg-white/10 backdrop-blur-md text-white/80 text-[10px] font-black px-2.5 py-1 rounded-lg uppercase tracking-widest border border-white/10">What's Happening</span>
                                </div>
                                <h2 className="text-4xl sm:text-6xl font-black tracking-tighter mb-4">Pembrokeshire Events</h2>
                                <p className="text-white/70 text-base sm:text-lg font-medium max-w-xl leading-relaxed">Discover upcoming gatherings and activities across the coast and countryside.</p>
                            </div>
                        </div>
                    </div>

                    <main className="max-w-6xl mx-auto px-6 py-8">
                        {viewMode === 'list' ? (
                            <div className="space-y-6">
                                {activeTag && (
                                    <div className="flex items-center gap-3 bg-white border border-sky-100 p-3 pl-5 rounded-2xl shadow-sm animate-in slide-in-from-right-4">
                                        <Icon name="tag" size={18} className="text-sky-500" /> 
                                        <span className="text-sm font-bold text-slate-700">Showing: <span className="text-sky-600">{activeTag}</span></span>
                                        <button onClick={() => setActiveTag(null)} className="ml-auto bg-slate-50 hover:bg-red-50 p-2 rounded-2xl text-slate-400 hover:text-red-500 transition-colors"><Icon name="x" size={16}/></button>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                    {displayEvents.length > 0 ? displayEvents.map(event => {
                                        const isMyOwn = user && event.createdBy === user.uid;
                                        const durationText = calculateDuration(event.date, event.endDate);
                                        
                                        return (
                                            <div key={event.id} className={`event-card bg-white p-4 sm:p-5 rounded-3xl border border-slate-200/60 shadow-sm hover:shadow-lg hover:border-sky-100/50 relative overflow-hidden group ${event.status === 'pending' ? 'bg-amber-50/5' : ''}`}>
                                                <div className="flex items-center gap-4 sm:gap-5">
                                                    <div className="flex-shrink-0 flex flex-col items-center justify-center w-14 h-16 bg-slate-50 rounded-2xl border border-slate-100 group-hover:bg-sky-600 group-hover:text-white transition-all duration-300 shadow-sm">
                                                        <span className="text-[9px] font-black uppercase tracking-widest opacity-60">{new Date(event.date).toLocaleDateString('en-US', { month: 'short' })}</span>
                                                        <span className="text-2xl font-black leading-none">{new Date(event.date).getDate()}</span>
                                                    </div>
                                                    
                                                    <div className="flex-grow min-w-0">
                                                        <div className="flex items-center gap-2 mb-1 flex-wrap">
                                                            {/* Entry Type Tag */}
                                                            <button 
                                                                onClick={() => setActiveTag(event.entryType)}
                                                                className={`text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded-full shadow-sm border ${event.entryType === 'Free' ? 'bg-green-50 text-green-700 border-green-200' : 'bg-orange-50 text-orange-700 border-orange-200'}`}
                                                            >
                                                                {event.entryType === 'Free' ? 'Free Entry' : `Entry: £${event.entryFee}`}
                                                            </button>

                                                            {event.tags && event.tags.map(t => (
                                                                <button key={t} onClick={() => setActiveTag(t)} className="text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded-full shadow-sm tag-pill border border-slate-100">
                                                                    {t}
                                                                </button>
                                                            ))}
                                                            
                                                            {event.status === 'pending' && <span className="text-[8px] font-black bg-amber-500 text-white px-2 py-0.5 rounded-full shadow-md">Reviewing</span>}
                                                            {durationText && <span className="text-[8px] font-black bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full border border-indigo-100 uppercase tracking-tighter">{durationText}</span>}
                                                        </div>
                                                        
                                                        <h3 className="text-lg font-extrabold text-slate-900 group-hover:text-sky-600 transition-colors truncate">{event.title}</h3>
                                                        
                                                        <div className="flex flex-wrap gap-x-4 gap-y-1 mt-2">
                                                            <div className="flex items-center gap-1.5 text-xs font-semibold text-slate-400"><Icon name="clock" size={12} className="text-sky-500" /> {event.time}</div>
                                                            <button onClick={() => setActiveTag(event.location)} className="flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-sky-600 transition-colors"><Icon name="map-pin" size={12} className="text-sky-500" /> {event.location}</button>
                                                            {event.contact && <div className="flex items-center gap-1.5 text-xs font-semibold text-slate-400"><Icon name="mail" size={12} className="text-sky-500" /> {event.contact}</div>}
                                                        </div>
                                                    </div>

                                                    <div className="flex flex-row sm:flex-col gap-2 shrink-0 items-center">
                                                        {event.status === 'approved' && (
                                                            <button 
                                                                onClick={() => downloadCalendarFile(event)} 
                                                                title="Add to Calendar" 
                                                                className="md:hidden w-10 h-10 bg-slate-50 border border-slate-100 text-slate-400 rounded-xl flex items-center justify-center hover:bg-sky-50 hover:text-sky-600 transition-all active:scale-90"
                                                            >
                                                                <div className="relative">
                                                                    <Icon name="calendar" size={18} />
                                                                    <span className="absolute -top-1 -right-1 text-[10px] font-black text-sky-600 bg-white rounded-full leading-none">+</span>
                                                                </div>
                                                            </button>
                                                        )}
                                                        
                                                        {isAdmin && event.status === 'pending' && (
                                                            <button onClick={() => approveEvent(event.id)} className="w-10 h-10 bg-green-500 text-white rounded-xl flex items-center justify-center hover:bg-green-600 shadow-md transition-all active:scale-90">
                                                                <Icon name="check" size={20} />
                                                            </button>
                                                        )}
                                                        {(isAdmin || (isMyOwn && event.status === 'pending')) && (
                                                            <button onClick={() => deleteEvent(event.id)} className="w-10 h-10 bg-white border border-slate-100 text-slate-300 hover:text-red-500 hover:border-red-100 rounded-xl flex items-center justify-center transition-all shadow-sm active:scale-90">
                                                                <Icon name="trash-2" size={18} />
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    }) : (
                                        <div className="lg:col-span-2 text-center py-20 bg-white rounded-[3rem] border-4 border-dashed border-slate-100">
                                            <div className="bg-slate-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
                                                <Icon name="calendar-x" size={32} className="text-slate-200" />
                                            </div>
                                            <h3 className="text-xl font-black text-slate-800">No events found</h3>
                                            <p className="text-slate-400 mt-2 font-medium">Check back soon or share a new gathering.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white rounded-[3.5rem] border border-slate-200/60 shadow-2xl overflow-hidden animate-in zoom-in duration-500">
                                <div className="p-10 flex flex-col sm:flex-row sm:items-center justify-between bg-slate-50/50 border-b border-slate-100 gap-6">
                                    <h2 className="text-4xl font-black text-slate-900 tracking-tighter leading-none">{currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h2>
                                    <div className="flex gap-4">
                                        <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() - 1)))} className="w-12 h-12 flex items-center justify-center bg-white border border-slate-200 rounded-2xl hover:bg-slate-50 transition-all shadow-sm"><Icon name="chevron-left" /></button>
                                        <button onClick={() => setCurrentDate(new Date())} className="px-8 h-12 bg-white border border-slate-200 rounded-2xl text-xs font-black text-slate-700 hover:bg-slate-50 transition-all shadow-sm uppercase tracking-widest">Today</button>
                                        <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() + 1)))} className="w-12 h-12 flex items-center justify-center bg-white border border-slate-200 rounded-2xl hover:bg-slate-50 transition-all shadow-sm"><Icon name="chevron-right" /></button>
                                    </div>
                                </div>
                                <div className="calendar-grid bg-white text-center py-6 border-b border-slate-50">
                                    {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => <div key={day} className="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">{day}</div>)}
                                </div>
                                <div className="calendar-grid bg-white">{renderCalendar()}</div>
                            </div>
                        )}
                    </main>

                    {/* Submission Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-slate-900/70 backdrop-blur-xl animate-in fade-in duration-300">
                            <div className="bg-white w-full max-w-2xl rounded-[3rem] shadow-2xl overflow-hidden animate-in zoom-in slide-in-from-bottom-8 duration-500 max-h-[90vh] overflow-y-auto">
                                <div className="p-8 sm:p-12 pb-0 flex justify-between items-start sticky top-0 bg-white z-10">
                                    <div>
                                        <h3 className="text-3xl sm:text-4xl font-black text-slate-900 tracking-tighter">{isAdmin ? "New Event" : "Suggest Event"}</h3>
                                        <p className="text-slate-400 text-sm font-medium mt-2">Help the community grow by sharing an event.</p>
                                    </div>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-slate-50 hover:bg-red-50 text-slate-400 hover:text-red-500 w-12 h-12 rounded-2xl flex items-center justify-center transition-all"><Icon name="x" size={24} /></button>
                                </div>
                                
                                <form onSubmit={handleAddEvent} className="p-8 sm:p-12 space-y-8">
                                    <div className="grid gap-8">
                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">What is it called?</label>
                                            <input required type="text" placeholder="e.g. Village Market Day" className="w-full bg-slate-50 px-8 py-5 rounded-3xl border border-slate-100 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all font-bold text-lg" value={newEvent.title} onChange={e => setNewEvent({...newEvent, title: e.target.value})} />
                                        </div>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-8">
                                            <div className="space-y-3">
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Start Date</label>
                                                <input required type="date" className="w-full bg-slate-50 px-8 py-5 rounded-3xl border border-slate-100 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all font-bold" value={newEvent.date} onChange={e => setNewEvent({...newEvent, date: e.target.value})} />
                                            </div>
                                            <div className="space-y-3">
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Start Time</label>
                                                <input required type="time" className="w-full bg-slate-50 px-8 py-5 rounded-3xl border border-slate-100 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all font-bold" value={newEvent.time} onChange={e => setNewEvent({...newEvent, time: e.target.value})} />
                                            </div>
                                        </div>

                                        <div className="bg-slate-50 p-6 rounded-[2rem] border border-slate-100 space-y-4">
                                            <label className="flex items-center gap-3 cursor-pointer group">
                                                <input 
                                                    type="checkbox" 
                                                    className="hidden" 
                                                    checked={newEvent.isMultiDay} 
                                                    onChange={() => setNewEvent(p => ({...p, isMultiDay: !p.isMultiDay, endDate: !p.isMultiDay ? p.date : ''}))} 
                                                />
                                                <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${newEvent.isMultiDay ? 'bg-indigo-600 border-indigo-600' : 'border-slate-300'}`}>
                                                    {newEvent.isMultiDay && <Icon name="check" size={14} className="text-white" />}
                                                </div>
                                                <span className="text-sm font-bold text-slate-700">Does this event last for more than one day?</span>
                                            </label>

                                            {newEvent.isMultiDay && (
                                                <div className="space-y-3 pt-2 animate-in slide-in-from-top-2 duration-200">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Finish Date</label>
                                                    <input 
                                                        required 
                                                        type="date" 
                                                        min={newEvent.date}
                                                        className="w-full bg-white px-8 py-5 rounded-3xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 outline-none transition-all font-bold" 
                                                        value={newEvent.endDate} 
                                                        onChange={e => setNewEvent({...newEvent, endDate: e.target.value})} 
                                                    />
                                                </div>
                                            )}
                                        </div>

                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Entry Details</label>
                                            <div className="grid grid-cols-2 gap-4 bg-slate-50 p-1 rounded-3xl border border-slate-100">
                                                <button 
                                                    type="button"
                                                    onClick={() => setNewEvent({...newEvent, entryType: 'Free', entryFee: ''})}
                                                    className={`py-3 px-6 rounded-2xl text-sm font-bold transition-all ${newEvent.entryType === 'Free' ? 'bg-white shadow-md text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
                                                >
                                                    Free Entry
                                                </button>
                                                <button 
                                                    type="button"
                                                    onClick={() => setNewEvent({...newEvent, entryType: 'Paid'})}
                                                    className={`py-3 px-6 rounded-2xl text-sm font-bold transition-all ${newEvent.entryType === 'Paid' ? 'bg-white shadow-md text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}
                                                >
                                                    Paid Entry
                                                </button>
                                            </div>

                                            {newEvent.entryType === 'Paid' && (
                                                <div className="space-y-2 pt-2 animate-in slide-in-from-top-2 duration-200">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Entry Fee (£)</label>
                                                    <div className="relative">
                                                        <span className="absolute left-6 top-1/2 -translate-y-1/2 font-bold text-slate-400">£</span>
                                                        <input 
                                                            required 
                                                            type="text" 
                                                            placeholder="5.00"
                                                            className="w-full bg-white pl-10 pr-8 py-5 rounded-3xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 outline-none transition-all font-bold" 
                                                            value={newEvent.entryFee} 
                                                            onChange={e => setNewEvent({...newEvent, entryFee: e.target.value.replace(/[^0-9.]/g, '')})} 
                                                        />
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Where is it happening?</label>
                                            <input required type="text" placeholder="e.g. Town Hall" className="w-full bg-slate-50 px-8 py-5 rounded-3xl border border-slate-100 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all font-bold" value={newEvent.location} onChange={e => setNewEvent({...newEvent, location: e.target.value})} />
                                        </div>

                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Event Tags (Select all that apply)</label>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                {AVAILABLE_TAGS.map(tag => (
                                                    <label key={tag} className={`flex items-center gap-3 p-3 rounded-2xl border transition-all cursor-pointer ${newEvent.tags.includes(tag) ? 'bg-sky-50 border-sky-400 text-sky-700' : 'bg-slate-50 border-slate-100 text-slate-500 hover:border-sky-200'}`}>
                                                        <input 
                                                            type="checkbox" 
                                                            className="hidden" 
                                                            checked={newEvent.tags.includes(tag)} 
                                                            onChange={() => toggleTag(tag)} 
                                                        />
                                                        <Icon name={newEvent.tags.includes(tag) ? "check-circle" : "circle"} size={16} className={newEvent.tags.includes(tag) ? "text-sky-600" : "text-slate-300"} />
                                                        <span className="text-xs font-bold">{tag}</span>
                                                    </label>
                                                ))}
                                                <label className={`flex items-center gap-3 p-3 rounded-2xl border transition-all cursor-pointer ${newEvent.isOtherTagSelected ? 'bg-sky-50 border-sky-400 text-sky-700' : 'bg-slate-50 border-slate-100 text-slate-500 hover:border-sky-200'}`}>
                                                    <input 
                                                        type="checkbox" 
                                                        className="hidden" 
                                                        checked={newEvent.isOtherTagSelected} 
                                                        onChange={() => setNewEvent(p => ({...p, isOtherTagSelected: !p.isOtherTagSelected}))} 
                                                    />
                                                    <Icon name={newEvent.isOtherTagSelected ? "check-circle" : "circle"} size={16} className={newEvent.isOtherTagSelected ? "text-sky-600" : "text-slate-300"} />
                                                    <span className="text-xs font-bold">Other...</span>
                                                </label>
                                            </div>

                                            {newEvent.isOtherTagSelected && (
                                                <div className="mt-2 animate-in slide-in-from-top-1 duration-200">
                                                    <input 
                                                        type="text" 
                                                        placeholder="Type your custom tag..."
                                                        className="w-full bg-white px-6 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 outline-none transition-all font-bold text-sm" 
                                                        value={newEvent.otherTag} 
                                                        onChange={e => setNewEvent(p => ({...p, otherTag: e.target.value}))} 
                                                    />
                                                </div>
                                            )}
                                        </div>

                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Contact Details</label>
                                            <input type="text" placeholder="Email or Phone Number" className="w-full bg-slate-50 px-8 py-5 rounded-3xl border border-slate-100 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all font-bold" value={newEvent.contact} onChange={e => setNewEvent({...newEvent, contact: e.target.value})} />
                                        </div>

                                        <div className="space-y-3">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Tell us more</label>
                                            <textarea rows="3" placeholder="Description of the event..." className="w-full bg-slate-50 px-8 py-5 rounded-3xl border border-slate-100 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all font-medium text-slate-600" value={newEvent.description} onChange={e => setNewEvent({...newEvent, description: e.target.value})}></textarea>
                                        </div>
                                    </div>
                                    
                                    <button type="submit" className="w-full py-6 rounded-3xl bg-indigo-600 text-white font-black text-xl hover:bg-indigo-700 shadow-2xl shadow-indigo-200 transition-all active:scale-95">
                                        {isAdmin ? "Publish Event Now" : "Send for Hub Review"}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
