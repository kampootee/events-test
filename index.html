<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Hub</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel to run JSX in the browser -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        /* Custom scrollbar for better look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <!-- data-type="module" tells Babel to output an ES module -->
    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;

        // Firebase Setup - Using 11.6.1 ESM
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global environment variables provided by the environment
        // Safely check for variables to prevent "White Page" crash when running locally
        let firebaseConfig = null;
        try {
            firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        } catch (e) {
            console.error("Failed to parse firebase config", e);
        }

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'community-calendar-app';
        
        // --- CONFIGURATION ---
        // Copy your UID from the bottom of the "Add Event" modal and paste it here
        const ADMIN_UID = "YOUR_ADMIN_UID_HERE"; 

        /**
         * Stable Icon Component
         */
        const Icon = ({ name, size = 18, className = "" }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (window.lucide && containerRef.current) {
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.style.width = `${size}px`;
                    i.style.height = `${size}px`;
                    containerRef.current.innerHTML = '';
                    containerRef.current.appendChild(i);
                    window.lucide.createIcons({
                        root: containerRef.current,
                        attrs: { class: className }
                    });
                }
            }, [name, size, className]);

            return <span ref={containerRef} className="inline-flex items-center justify-center pointer-events-none"></span>;
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [events, setEvents] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [viewMode, setViewMode] = useState('list'); 
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [currentDate, setCurrentDate] = useState(new Date());
            const [activeTag, setActiveTag] = useState(null);
            const [copyFeedback, setCopyFeedback] = useState(false);
            
            // Initialization Check
            if (!firebaseConfig) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-100">
                        <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-slate-200">
                            <div className="bg-amber-100 w-16 h-16 rounded-full flex items-center justify-center mb-6">
                                <Icon name="alert-triangle" className="text-amber-600" size={32} />
                            </div>
                            <h2 className="text-2xl font-black text-slate-800 mb-4 tracking-tight">Setup Required</h2>
                            <p className="text-slate-600 leading-relaxed mb-6">
                                To run this application locally, you need to provide a Firebase configuration object. 
                                <br/><br/>
                                1. Create a Firebase project at <span className="font-mono text-xs bg-slate-100 px-1">console.firebase.google.com</span>.
                                <br/>
                                2. Copy the config object and replace <span className="font-mono text-xs bg-slate-100 px-1">__firebase_config</span> in the code.
                            </p>
                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Running in Sandbox?</p>
                                <p className="text-xs text-slate-500 mt-1">If you are seeing this inside the interactive preview, please refresh the page.</p>
                            </div>
                        </div>
                    </div>
                );
            }

            // Initialize Services
            const app = useMemo(() => initializeApp(firebaseConfig), []);
            const auth = useMemo(() => getAuth(app), [app]);
            const db = useMemo(() => getFirestore(app), [app]);

            const isAdmin = user?.uid === ADMIN_UID;

            const [newEvent, setNewEvent] = useState({
                title: '',
                date: '',
                time: '',
                location: '',
                description: '',
                category: 'General'
            });

            // Auth Login
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth error:", error);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, (u) => setUser(u));
                return () => unsubscribe();
            }, [auth]);

            // Data Stream
            useEffect(() => {
                if (!user) return;
                const eventsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'events');
                const unsubscribe = onSnapshot(query(eventsCollection), (snapshot) => {
                    setEvents(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                    setIsLoading(false);
                }, (err) => {
                    console.error("Firestore error:", err);
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [user, db]);

            // Filter & Sort
            const displayEvents = useMemo(() => {
                let filtered = [...events];
                if (!isAdmin) filtered = filtered.filter(e => e.status === 'approved');
                if (activeTag) {
                    filtered = filtered.filter(e => e.location?.toLowerCase() === activeTag.toLowerCase());
                }
                return filtered.sort((a, b) => new Date(`${a.date}T${a.time}`) - new Date(`${b.date}T${b.time}`));
            }, [events, activeTag, isAdmin]);

            const handleAddEvent = async (e) => {
                e.preventDefault();
                if (!newEvent.title || !newEvent.date || !user) return;
                try {
                    const eventsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'events');
                    await addDoc(eventsCollection, {
                        ...newEvent,
                        status: isAdmin ? 'approved' : 'pending',
                        createdBy: user.uid,
                        createdAt: new Date().toISOString()
                    });
                    setNewEvent({ title: '', date: '', time: '', location: '', description: '', category: 'General' });
                    setIsModalOpen(false);
                } catch (error) { console.error("Post error:", error); }
            };

            const approveEvent = async (id) => {
                const eventDoc = doc(db, 'artifacts', appId, 'public', 'data', 'events', id);
                await updateDoc(eventDoc, { status: 'approved' });
            };

            const deleteEvent = async (id) => {
                const eventDoc = doc(db, 'artifacts', appId, 'public', 'data', 'events', id);
                await deleteDoc(eventDoc);
            };

            const copyUID = () => {
                if (user?.uid) {
                    const el = document.createElement('textarea');
                    el.value = user.uid;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                    setCopyFeedback(true);
                    setTimeout(() => setCopyFeedback(false), 2000);
                }
            };

            const renderCalendar = () => {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const firstDay = new Date(year, month, 1).getDay();
                const days = [];
                
                for (let i = 0; i < firstDay; i++) {
                    days.push(<div key={`empty-${i}`} className="h-24 border border-slate-100 bg-slate-50/50"></div>);
                }
                
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const dayEvents = displayEvents.filter(e => e.date === dateStr);
                    days.push(
                        <div key={d} className="h-24 border border-slate-100 p-1 overflow-hidden hover:bg-indigo-50 transition-colors group">
                            <span className="text-xs font-semibold text-slate-400 group-hover:text-indigo-400">{d}</span>
                            <div className="mt-1 space-y-1">
                                {dayEvents.map(event => (
                                    <div 
                                        key={event.id} 
                                        onClick={() => { setActiveTag(event.location); setViewMode('list'); }} 
                                        className={`text-[10px] truncate px-1 rounded cursor-pointer leading-tight py-0.5 ${event.status === 'pending' ? 'bg-amber-500 text-white' : 'bg-indigo-600 text-white'}`}
                                    >
                                        {event.time} {event.title}
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }
                return days;
            };

            if (isLoading) return (
                <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 space-y-4">
                    <Icon name="loader-2" className="animate-spin text-indigo-600" size={40} />
                    <p className="text-slate-500 font-medium tracking-tight">Syncing with Community Hub...</p>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 pb-20">
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setActiveTag(null)}>
                                <div className="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-100 flex items-center justify-center">
                                    <Icon name="calendar-days" className="text-white" />
                                </div>
                                <h1 className="text-xl font-bold text-slate-800 tracking-tight">Community Hub</h1>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="flex bg-slate-100 p-1 rounded-xl">
                                    <button onClick={() => setViewMode('list')} className={`p-1.5 rounded-lg transition-all ${viewMode === 'list' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>
                                        <Icon name="list" />
                                    </button>
                                    <button onClick={() => setViewMode('calendar')} className={`p-1.5 rounded-lg transition-all ${viewMode === 'calendar' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>
                                        <Icon name="layout-grid" />
                                    </button>
                                </div>
                                <button onClick={() => setIsModalOpen(true)} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl flex items-center gap-2 text-sm font-bold shadow-md active:scale-95 transition-all">
                                    <Icon name="plus" /> {isAdmin ? "Add Event" : "Submit Event"}
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-5xl mx-auto px-4 py-8">
                        {viewMode === 'list' ? (
                            <div className="space-y-6">
                                <header className="flex flex-col md:flex-row md:items-end justify-between gap-4">
                                    <div>
                                        <h2 className="text-3xl font-black text-slate-900 tracking-tight">Upcoming Events</h2>
                                        <div className="flex items-center gap-2 mt-2">
                                            {isAdmin && <span className="flex items-center gap-1 text-indigo-600 font-bold bg-indigo-50 px-3 py-1 rounded-full text-xs border border-indigo-100 shadow-sm"><Icon name="shield-check" size={14}/> Admin Mode Active</span>}
                                            <p className="text-slate-500 text-sm">Discover and share local gatherings</p>
                                        </div>
                                    </div>
                                    {activeTag && (
                                        <div className="flex items-center gap-2 bg-amber-50 border border-amber-200 px-4 py-2 rounded-full text-amber-700 text-sm font-bold shadow-sm animate-in fade-in slide-in-from-right-4">
                                            <Icon name="tag" size={14} className="text-amber-500" /> 
                                            <span>Events in: <strong>{activeTag}</strong></span>
                                            <button onClick={() => setActiveTag(null)} className="ml-1 p-1 hover:bg-amber-200 rounded-full transition-colors"><Icon name="x" size={14}/></button>
                                        </div>
                                    )}
                                </header>

                                <div className="grid gap-5">
                                    {displayEvents.length > 0 ? displayEvents.map(event => (
                                        <div key={event.id} className={`bg-white p-6 rounded-3xl border transition-all relative ${event.status === 'pending' ? 'border-amber-200 bg-amber-50/20' : 'border-slate-200 shadow-sm hover:shadow-xl hover:border-indigo-100'}`}>
                                            <div className="flex flex-col md:flex-row md:items-center gap-6">
                                                <div className={`flex-shrink-0 w-16 h-16 rounded-2xl flex flex-col items-center justify-center border shadow-sm ${event.status === 'pending' ? 'bg-amber-100 text-amber-600 border-amber-200' : 'bg-indigo-50 text-indigo-600 border-indigo-100'}`}>
                                                    <span className="text-[10px] font-black uppercase tracking-wider">{new Date(event.date).toLocaleDateString('en-US', { month: 'short' })}</span>
                                                    <span className="text-3xl font-black leading-none">{new Date(event.date).getDate()}</span>
                                                </div>
                                                <div className="flex-grow">
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <span className="text-[10px] font-black tracking-widest uppercase bg-slate-100 px-2.5 py-1 rounded-full text-slate-500 border border-slate-200">{event.category}</span>
                                                        {event.status === 'pending' && <span className="text-[10px] font-black bg-amber-500 text-white px-2.5 py-1 rounded-full flex items-center gap-1 shadow-sm"><Icon name="clock" size={10}/> PENDING APPROVAL</span>}
                                                    </div>
                                                    <h3 className="text-xl font-bold text-slate-900 group-hover:text-indigo-600">{event.title}</h3>
                                                    <p className="text-slate-600 text-sm mt-1 leading-relaxed">{event.description}</p>
                                                    <div className="flex flex-wrap gap-5 mt-5 text-sm font-semibold text-slate-500">
                                                        <div className="flex items-center gap-2 bg-slate-50 px-3 py-1 rounded-lg border border-slate-100"><Icon name="clock" size={14} className="text-indigo-500" />{event.time}</div>
                                                        <button onClick={() => setActiveTag(event.location)} className={`flex items-center gap-2 px-3 py-1 rounded-lg border transition-all ${activeTag === event.location ? 'bg-amber-100 border-amber-200 text-amber-700' : 'bg-slate-50 border-slate-100 hover:border-indigo-200 hover:text-indigo-600'}`}>
                                                            <Icon name="map-pin" size={14} className={activeTag === event.location ? 'text-amber-500' : 'text-indigo-500'} /> {event.location}
                                                        </button>
                                                    </div>
                                                </div>
                                                <div className="flex md:flex-col gap-3">
                                                    {isAdmin && event.status === 'pending' && <button onClick={() => approveEvent(event.id)} className="bg-green-600 text-white p-3 rounded-2xl hover:bg-green-700 shadow-lg shadow-green-100 transition-all active:scale-90"><Icon name="check-circle" size={20}/></button>}
                                                    {isAdmin && <button onClick={() => deleteEvent(event.id)} className="bg-white border border-red-100 text-red-500 p-3 rounded-2xl hover:bg-red-500 hover:text-white transition-all active:scale-90 shadow-sm"><Icon name="trash-2" size={20}/></button>}
                                                </div>
                                            </div>
                                        </div>
                                    )) : (
                                        <div className="text-center py-24 bg-white rounded-[40px] border-4 border-dashed border-slate-100">
                                            <Icon name="calendar" size={48} className="text-slate-200 mx-auto mb-4" />
                                            <h3 className="text-2xl font-bold text-slate-800">{activeTag ? `No events in ${activeTag}` : 'The calendar is quiet...'}</h3>
                                            <p className="text-slate-400 mt-2">Check back soon or share your own event!</p>
                                            {activeTag && <button onClick={() => setActiveTag(null)} className="mt-6 text-indigo-600 font-bold hover:underline bg-indigo-50 px-6 py-2 rounded-full">Show all events</button>}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white rounded-[40px] border border-slate-200 shadow-xl overflow-hidden animate-in zoom-in duration-300">
                                <div className="p-8 flex items-center justify-between border-b border-slate-100 bg-slate-50/30">
                                    <h2 className="text-2xl font-black text-slate-900 tracking-tight">{currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h2>
                                    <div className="flex gap-3">
                                        <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() - 1)))} className="p-2.5 hover:bg-white border border-transparent hover:border-slate-200 rounded-2xl transition-all"><Icon name="chevron-left" /></button>
                                        <button onClick={() => setCurrentDate(new Date())} className="px-6 py-2.5 text-sm font-bold bg-white border border-slate-200 rounded-2xl shadow-sm hover:shadow-md transition-all">Today</button>
                                        <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() + 1)))} className="p-2.5 hover:bg-white border border-transparent hover:border-slate-200 rounded-2xl transition-all"><Icon name="chevron-right" /></button>
                                    </div>
                                </div>
                                <div className="calendar-grid bg-white border-b border-slate-100">
                                    {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => <div key={day} className="py-4 text-center text-[11px] font-black text-slate-400 uppercase tracking-[0.2em]">{day}</div>)}
                                </div>
                                <div className="calendar-grid">{renderCalendar()}</div>
                            </div>
                        )}
                    </main>

                    {isModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-md animate-in fade-in duration-200">
                            <div className="bg-white w-full max-w-lg rounded-[40px] shadow-2xl overflow-hidden animate-in zoom-in slide-in-from-bottom-8 duration-300">
                                <div className="p-8 border-b border-slate-50 flex justify-between items-center bg-indigo-50/50">
                                    <h3 className="text-2xl font-black text-indigo-950 tracking-tight">{isAdmin ? "Publish Event" : "Submit Community Event"}</h3>
                                    <button onClick={() => setIsModalOpen(false)} className="bg-white p-2 rounded-full shadow-md text-slate-400 hover:text-indigo-600 transition-all"><Icon name="plus" className="rotate-45" size={24} /></button>
                                </div>
                                <form onSubmit={handleAddEvent} className="p-8 space-y-5">
                                    {!isAdmin && (
                                        <div className="bg-indigo-600 p-5 rounded-[24px] flex items-start gap-4 text-sm text-indigo-50 shadow-lg shadow-indigo-100">
                                            <Icon name="info" className="shrink-0 text-indigo-200" size={24} /> 
                                            <p className="font-medium">Thanks for contributing! Your event will be reviewed by the admin team before appearing on the public community map.</p>
                                        </div>
                                    )}
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Event Title</label>
                                            <input required type="text" placeholder="e.g. Village Summer Fair" className="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all text-lg font-bold placeholder:text-slate-200" value={newEvent.title} onChange={e => setNewEvent({...newEvent, title: e.target.value})} />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Date</label>
                                                <input required type="date" className="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all font-bold" value={newEvent.date} onChange={e => setNewEvent({...newEvent, date: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Start Time</label>
                                                <input required type="time" className="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all font-bold" value={newEvent.time} onChange={e => setNewEvent({...newEvent, time: e.target.value})} />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Location / Neighborhood</label>
                                            <input required type="text" placeholder="e.g. Tenby Harbor" className="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-indigo-100 focus:border-indigo-400 outline-none transition-all font-bold" value={newEvent.location} onChange={e => setNewEvent({...newEvent, location: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Event Category</label>
                                            <select className="w-full px-5 py-4 rounded-2xl border border-slate-200 outline-none bg-white font-bold cursor-pointer hover:border-indigo-200 transition-colors appearance-none" value={newEvent.category} onChange={e => setNewEvent({...newEvent, category: e.target.value})}>
                                                <option>General</option><option>Social</option><option>Culture</option><option>Environment</option><option>Meeting</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 ml-1">Tell us more</label>
                                            <textarea rows="3" placeholder="Briefly describe the event details..." className="w-full px-5 py-4 rounded-2xl border border-slate-200 outline-none font-medium text-slate-600" value={newEvent.description} onChange={e => setNewEvent({...newEvent, description: e.target.value})}></textarea>
                                        </div>
                                    </div>
                                    
                                    <button type="submit" className="w-full py-5 rounded-[24px] bg-indigo-600 text-white font-black text-lg hover:bg-indigo-700 shadow-xl shadow-indigo-100 transition-all active:scale-95">
                                        {isAdmin ? "Publish Event Now" : "Submit for Approval"}
                                    </button>

                                    <div className="mt-4 pt-6 border-t border-slate-100">
                                        <div className="flex items-center justify-between bg-slate-50 border border-slate-200 p-3 rounded-2xl">
                                            <div className="overflow-hidden">
                                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-0.5">Your User Identifier (for Admin Setup)</p>
                                                <code className="text-[10px] text-slate-600 truncate block">{user?.uid}</code>
                                            </div>
                                            <button type="button" onClick={copyUID} className={`p-3 rounded-xl transition-all shadow-sm ${copyFeedback ? 'bg-green-500 text-white' : 'bg-white text-slate-500 hover:text-indigo-600'}`}>
                                                <Icon name={copyFeedback ? "check-circle" : "copy"} size={16} />
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
